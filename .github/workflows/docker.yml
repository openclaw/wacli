name: docker

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: docker build --pull -t wacli:ci .

      - name: Smoke test image
        run: |
          set -euo pipefail
          docker run --rm wacli:ci --version
          docker run --rm wacli:ci --help
          docker run --rm --entrypoint ffmpeg wacli:ci -version
