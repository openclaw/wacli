name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  windows-delegate:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Test Windows named-pipe delegation
        run: go test -count=1 ./internal/delegate

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup CI Environment
        uses: ./.github/actions/setup-ci-env
        with:
          setup-node: "true"
          node-version: "26.13.1"
          setup-pnpm: "true"
          apt-packages: "build-essential"

      - name: pnpm format:check
        run: pnpm format:check

      - name: pnpm lint
        run: pnpm lint

      - name: Verify exact Go build toolchain
        run: test "$(go env GOVERSION)" = "go1.27.4"

      - name: govulncheck source
        run: pnpm govulncheck:source

      - name: pnpm lint:deadcode
        run: pnpm lint:deadcode

      - name: pnpm test
        env:
          CGO_ENABLED: "1"
        run: pnpm test

      - name: pnpm build
        env:
          CGO_ENABLED: "1"
        run: pnpm build

      - name: pnpm docs:site
        run: pnpm docs:site

  linux-release-builds:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup CI Environment
        uses: ./.github/actions/setup-ci-env
        with:
          go-version-file: go.mod
          apt-packages: "build-essential gcc-aarch64-linux-gnu libc6-dev-arm64-cross"

      - name: GoReleaser check (macOS)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.2
          args: check --config .goreleaser.yaml

      - name: GoReleaser check (linux/windows)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.2
          args: check --config .goreleaser-linux-windows.yaml

      - name: GoReleaser build (linux amd64/arm64)
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.2
          args: build --snapshot --clean --config .goreleaser-linux-windows.yaml --id wacli_linux_amd64 --id wacli_linux_arm64
