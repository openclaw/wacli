name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup CI Environment
        uses: ./.github/actions/setup-ci-env
        with:
          setup-node: "true"
          node-version: "26"
          setup-pnpm: "true"
          apt-packages: "build-essential"

      - name: pnpm format:check
        run: pnpm format:check

      - name: pnpm lint
        run: pnpm lint

      - name: Verify exact Go build toolchain
        run: test "$(go env GOVERSION)" = "go1.27.1"

      - name: govulncheck source
        run: pnpm govulncheck:source

      - name: deadcode
        env:
          CGO_ENABLED: "1"
        run: |
          output_file=$(mktemp)
          go run golang.org/x/tools/cmd/deadcode@v0.49.0 -test -tags sqlite_fts5 ./... > "$output_file"
          if [ -s "$output_file" ]; then
            cat "$output_file"
            exit 1
          fi

      - name: pnpm test
        env:
          CGO_ENABLED: "1"
        run: pnpm test

      - name: pnpm build
        env:
          CGO_ENABLED: "1"
        run: pnpm build

  linux-release-builds:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup CI Environment
        uses: ./.github/actions/setup-ci-env
        with:
          go-version-file: go.mod
          apt-packages: "build-essential gcc-aarch64-linux-gnu libc6-dev-arm64-cross"

      - name: GoReleaser check (macOS)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.0
          args: check --config .goreleaser.yaml

      - name: GoReleaser check (linux/windows)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.0
          args: check --config .goreleaser-linux-windows.yaml

      - name: GoReleaser build (linux amd64/arm64)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.0
          args: build --snapshot --clean --config .goreleaser-linux-windows.yaml --id wacli_linux_amd64 --id wacli_linux_arm64
