name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer to release
        required: true
        type: string

permissions: {}

jobs:
  release:
    permissions:
      actions: read
      checks: read
      contents: write
      pull-requests: write
      statuses: read
    uses: openclaw/release-workflows/.github/workflows/release-go-cli.yml@v1
    with:
      version: ${{ inputs.version }}
      repository-type: openclaw
      homebrew-tap: openclaw/homebrew-tap
      homebrew-formula: wacli
      archive-files: '["LICENSE","README.md"]'
      checksum-filename: checksums.txt
      nfpm: disabled
      split-goreleaser-config: .goreleaser-linux-windows.yaml
      stable-identifier: org.openclaw.wacli
      ci-check-events: '["push","pull_request"]'
      reproducible-rebuild: non-darwin
      strict-checks: false
    secrets:
      MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
      MACOS_SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
