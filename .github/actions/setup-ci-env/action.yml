name: Setup CI Environment
description: Shared toolchain/bootstrap for CI and release jobs.

inputs:
  go-version-file:
    description: Path to go.mod/go.work file.
    required: false
    default: go.mod
  setup-node:
    description: Whether to install Node.js.
    required: false
    default: "false"
  node-version:
    description: Node.js version to install when setup-node is true.
    required: false
    default: "26.13.1"
  setup-pnpm:
    description: Whether to install the pnpm version from package.json.
    required: false
    default: "false"
  apt-packages:
    description: Space-separated apt packages to install (ubuntu only).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Node
      if: ${{ inputs.setup-node == 'true' }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Setup Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: ${{ inputs.go-version-file }}
        cache: true

    - name: Setup pnpm
      if: ${{ inputs.setup-pnpm == 'true' }}
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

    - name: Install apt packages
      if: ${{ inputs.apt-packages != '' }}
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends ${{ inputs.apt-packages }}
